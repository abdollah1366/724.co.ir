# Nginx سامانه ۷۲۴. این فایل الگوست: install.sh مقادیر @...@ را پر و در
# /etc/nginx/sites-available/724 ذخیره می‌کند. تغییر دستی را در همین الگو بدهید.

upstream app724 {
    server unix:/run/724/gunicorn.sock fail_timeout=0;
}

# HTTP: فقط تأیید دامنه برای گواهی Let's Encrypt؛ بقیه به HTTPS هدایت می‌شود.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name @SERVER_NAME@;
    server_tokens off;

    ssl_certificate @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL724:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # بیشترین حجم بارگذاری (اسکن مدارک، تصویر کالا)
    client_max_body_size 20m;

    access_log /var/log/nginx/724-access.log;
    error_log /var/log/nginx/724-error.log;

    location /static/ {
        alias /srv/724/static/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff;
    }

    # فقط فایل‌های عمومی (تصویر پزشک و کالا). مدارک بیماران در private_media است و
    # هرگز از اینجا سرو نمی‌شود. CSP جلوی اجرای اسکریپت در فایل بارگذاری‌شده را می‌گیرد.
    location /media/ {
        alias /srv/724/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
    }

    location / {
        proxy_pass http://app724;
        proxy_set_header Host $host;
        # Django با DJANGO_BEHIND_PROXY فقط به این سرآیند اعتماد می‌کند؛ مقدار ارسالی کاربر بازنویسی می‌شود.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
